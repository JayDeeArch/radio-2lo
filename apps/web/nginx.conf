resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Adres usługi API jest zmienną, a nie blokiem `upstream`.
    # Dzięki temu nginx rozwiązuje DNS dopiero przy pierwszym żądaniu. Z blokiem
    # `upstream` adres IP kontenera `api` zapamiętywałby się na starcie, a po
    # restarcie kontenera (Docker nadaje wtedy nowy IP) nginx wysyłałby żądania
    # w pustkę, aż do restartu całego stosu.
    set $radio_api http://api:3000;

    # UWAGA: dyrektywa add_header w bloku `location` CAŁKOWICIE zastępuje
    # nagłówki odziedziczone z poziomu `server`. Dlatego Cache-Control ustawiamy
    # dyrektywą `expires`, a nie `add_header` - inaczej te nagłówki poniżej
    # zniknęłyby na każdej stronie serwowanej przez location.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Odpowiedź na /healthz dla healthchecku Dockera (bez ruchu do API).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # Bez buforowania dla Server-Sent Events - bez tego nginx gromadzi zdarzenia
    # i uczniowie zobaczą decyzję administratora z opóźnieniem.
    location = /api/events {
        proxy_pass $radio_api;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }

    # Pozostałe API.
    location /api/ {
        proxy_pass $radio_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_read_timeout 30s;

        # Nie cache'ujemy odpowiedzi API.
        expires -1;
    }

    # Pliki z hashem w nazwie - bezpiecznie cache'ujemy na rok.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # SPA - każda nieznana ścieżka zwraca index.html.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
